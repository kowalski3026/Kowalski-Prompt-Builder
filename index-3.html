<style>
.catpic{width:100%;height:72px;overflow:hidden;border-radius:8px;margin:0 0 7px;background:#111;border:1px solid #3a3833}.catphoto{display:block;width:100%;height:100%;object-fit:cover}
.preset{text-align:left}
.preset b{font-size:18px}

:root{--bg:#141414;--surface:#1E1D1B;--ink:#F5F3F0;--muted:#A39E97;--line:#3A3833;--amber:#F59E0B;--field:#262522;--gridline:rgba(245,243,240,.06);--ok:#6CC08B}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--gridline) 27px 28px),repeating-linear-gradient(90deg,transparent 0 27px,var(--gridline) 27px 28px);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;padding-bottom:82px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:8;background:var(--surface);background-image:repeating-linear-gradient(0deg,transparent 0 27px,var(--gridline) 27px 28px),repeating-linear-gradient(90deg,transparent 0 27px,var(--gridline) 27px 28px);display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:4px solid var(--amber)}
.logo{width:64px;height:64px;object-fit:contain;flex:none;border-radius:5px}
.brand{font-family:"Barlow Condensed";font-size:22px;font-weight:700;line-height:1}
.brand small{display:block;color:var(--amber);font:600 11px Barlow;letter-spacing:.12em;margin-top:5px}
main{max-width:720px;margin:auto;padding:16px}
.hero{padding:5px 0 14px}.eyebrow{color:var(--amber);font-size:11px;font-weight:700;letter-spacing:.16em}.hero h1{font-size:40px;line-height:1.02;margin:5px 0 6px}.hero p{color:var(--muted);margin:0;line-height:1.4}
.section{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.13em;margin:18px 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid .card{margin:0}
.preset{min-height:108px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px}
.preset[aria-pressed=true]{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}
.preset b{display:block;font:700 19px/1 "Barlow Condensed";margin-bottom:5px}.preset span{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 5px}.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600}.chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
label{display:block;font-size:13px;font-weight:600;margin:8px 0 4px}.hint{font-size:12px;color:var(--muted);font-weight:400}
input,select,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-height:46px;outline:none}
textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid var(--amber);outline-offset:1px}
.btns{display:flex;gap:9px;margin-top:12px}.btn{flex:1;min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600}.primary{background:var(--amber);color:#141414;border-color:var(--amber)}
.result{background:#141414;border-radius:12px;overflow:hidden;margin-top:12px}.result:before{content:"";display:block;height:9px;background:repeating-linear-gradient(135deg,#F59E0B 0 12px,#141414 12px 24px)}.result .in{padding:14px}.result h3{font-size:26px}.result pre{white-space:pre-wrap;font:13px/1.55 Barlow;margin:10px 0 0;color:#eee}
.tag{display:inline-block;background:#2a2926;border:1px solid #3b3934;border-radius:999px;padding:4px 8px;font-size:11px;margin:0 5px 5px 0}.tag.amber{background:var(--amber);border-color:var(--amber);color:#141414;font-weight:700}
.smallbtn{background:transparent;color:var(--ink);border:1px solid #4a4843;border-radius:8px;padding:9px 11px;font-weight:600}
.item{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:10px;padding:12px;margin-bottom:9px}.item b{font-size:17px}.item p{margin:5px 0;color:var(--muted);font-size:13px}.item .btns{margin-top:8px}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;border:0;background:transparent;padding:10px 0 12px;font-family:"Barlow Condensed";font-weight:700;font-size:13px;color:var(--muted);border-top:3px solid transparent}
nav button.active{color:var(--ink);border-top-color:var(--amber)}
.sheetback{display:none}
@media(min-width:600px){main{padding:20px}.grid{grid-template-columns:repeat(4,1fr)}.hero h1{font-size:48px}}
.photochips{gap:7px}.photochoice{min-width:78px;width:82px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 0 6px;overflow:hidden;color:var(--ink);font-weight:600}.photochoice img{display:block;width:100%;height:52px;object-fit:cover}.photochoice span{display:block;font-size:10px;line-height:1.1;padding:5px 4px 0}.photochoice.active{border-color:var(--amber);box-shadow:inset 0 0 0 1px var(--amber)}</style>
</head>

function A(f){return ASSETS[f]||""}
function catSvg(type){
const file={
driveway:"driveway.jpg",patio:"patio.jpg",walkway:"walkway.jpg",steps:"steps.jpg",garage:"garage.jpg",
basement:"basement.jpg",foundation:"foundation.jpg",pool:"pool.jpg",retaining:"retaining.jpg",commercial:"commercial.jpg",
municipal:"municipal.jpg",heated:"heated.jpg",decorative:"decorative.jpg",other:"other.jpg",service:"service.jpg"
}[type]||"driveway.jpg";
return `<img class="catphoto" src="${A(file)}" alt="" loading="lazy">`;
}
function presetGroup(title,key,items,cls=""){
return `<div class="section">${title}</div><div class="chips">${items.map(x=>`<button class="chip ${S.sel[key]===x[0]?'active':''}" onclick="pick('${key}','${esc(x[0])}')">${esc(x[0])}</button>`).join("")}</div>`;
}
function pick(k,v){S.sel[k]=v;saveDB();render()}


function photoRow(title,key,items,prefix){
return `<div class="section">${title}</div><div class="chips photochips">${items.map(x=>{
const slug=x[0].toLowerCase().replace(/[^a-z0-9]+/g,"-");
const file=prefix.replace("assets/","")+"-"+slug+".jpg";
return `<button class="photochoice ${S.sel[key]===x[0]?'active':''}" onclick="pick('${key}','${esc(x[0])}')"><img src="${A(file)}" alt="" loading="lazy"><span>${esc(x[0])}</span></button>`;
}).join("")}</div>`;
}
function renderCreate(a){
const p=DATA.project;
const finishes=[["Broom Finish","Broom-finished concrete"],["Smooth Finish","Smooth finished concrete"],["Exposed Aggregate","Exposed aggregate concrete"],["Stamped","Stamped concrete"],["Stamped + Coloured","Stamped and coloured concrete"],["Salt Finish","Salt-finished concrete"],["Barn Board","Barn-board stamped concrete"],["Stone","Stone texture"],["Brick","Brick pattern"],["Slate","Slate texture"]];
const colours=[["Natural Grey","Natural Grey"],["Charcoal","Charcoal"],["Slate Grey","Slate Grey"],["Tan","Tan"],["Brown","Brown"],["Sandstone","Sandstone"],["Custom","Custom colour"]];
const scenes=[["New Build","New construction"],["Existing Home","Existing home"],["Backyard","Backyard"],["Front Entrance","Front entrance"],["Lakeside","Lakeside"],["Muskoka","Muskoka"],["Urban","Urban"],["Rural","Rural"]];
a.innerHTML=`<section class="hero"><div class="eyebrow">TYPE LESS. CREATE MORE.</div><h1>CREATE IMAGE PROMPT</h1><p>Tap your options below — no typing needed.</p></section>
<div class="card"><div class="section" style="margin-top:0">1. PROJECT TYPE</div><div class="grid">${p.map(x=>`<button class="preset" aria-pressed="${S.sel.project===x[0]}" onclick="pick('project','${esc(x[0])}')"><div class="catpic">${catSvg(x[1])}</div><b>${esc(x[0])}</b></button>`).join("")}</div></div>
<div class="card">${photoRow("2. FINISH / TEXTURE","finish",finishes,"assets/finish")}</div>
<div class="card">${photoRow("3. COLOUR","colour",colours,"assets/colour")}</div>
<div class="card">${photoRow("4. SCENE / SETTING","scene",scenes,"assets/scene")}</div>
${presetGroup("5. LIGHTING / SEASON","visual",DATA.visual)}
${presetGroup("6. CAMERA ANGLE","camera",DATA.camera)}
${presetGroup("7. PURPOSE","purpose",DATA.purpose)}
<div class="card"><label>OPTIONAL NOTE <span class="hint">Only use this when the presets aren't enough.</span></label><textarea id="note" placeholder="e.g. dark charcoal stamped patio beside a Muskoka lake...">${esc(S.note||"")}</textarea><div class="btns"><button class="btn primary" onclick="generate()">✨ GENERATE PROMPT</button><button class="btn" onclick="surprise()">⚡ SURPRISE ME</button></div></div><div id="result"></div>`;
}
function generate(){
S.note=document.getElementById("note")?.value||"";S.avoid=document.getElementById("avoid")?.value||"";
const p=S.sel;
const finish=(DATA.finish.find(x=>x[0]===p.finish)||["",""])[1]; const colour=p.colour||"Natural Grey"; const scene=p.scene||"Existing Home";
const purpose=(DATA.purpose.find(x=>x[0]===p.purpose)||["",""])[1];
const visual=(DATA.visual.find(x=>x[0]===p.visual)||["",""])[1];
const camera=(DATA.camera.find(x=>x[0]===p.camera)||["",""])[1];
const proj=(DATA.project.find(x=>x[0]===p.project)||["","",p.project])[2];
let prompt=`Create a ${purpose.toLowerCase()} for Kowalski Concrete Contracting Inc.

PROJECT
${proj}

FINISH / MATERIAL
${finish}
COLOUR
${colour}
SCENE / SETTING
${scene}

VISUAL DIRECTION
${visual}; ${camera}.

KOWALSKI BRAND DNA
• ${brandDNA.join("\n• ")}

COMPOSITION
Professional, believable construction photography/design. Show the concrete as the primary subject while keeping the surrounding property realistic and proportionally correct. Use natural materials, accurate edges, joints and finishing details. Make the result look like a real completed project photographed for an established Ontario concrete contractor.

${S.note?`USER NOTE\n${S.note}\n`:""}${S.avoid?`AVOID\n${S.avoid}`:`AVOID\nAI-looking textures, repeating geometric patterns, plastic-looking concrete, distorted perspective, impossible construction, excessive cracks, fake landscaping, clutter, oversaturation.`}`;

document.getElementById("result").innerHTML=`<div class="result"><div class="in"><h3>GENERATED PROMPT</h3><div style="margin-top:8px"><span class="tag amber">${esc(p.project)}</span><span class="tag">${esc(p.finish)}</span><span class="tag">${esc(p.purpose)}</span><span class="tag">${esc(p.visual)}</span></div><pre id="promptText">${esc(prompt)}</pre><div class="btns"><button class="smallbtn" onclick="copyPrompt()">COPY</button><button class="smallbtn" onclick="saveCurrent()">SAVE</button><button class="smallbtn" onclick="generate()">REGENERATE</button></div></div></div>`;
S.lastPrompt=prompt;saveDB();window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function copyPrompt(){navigator.clipboard.writeText(S.lastPrompt||"").then(()=>toast("Prompt copied"))}
function saveCurrent(){if(!S.lastPrompt)return;S.saved=S.saved||[];S.saved.unshift({id:Date.now(),title:`${S.sel.project} — ${S.sel.purpose}`,date:new Date().toLocaleString(),prompt:S.lastPrompt});S.saved=S.saved.slice(0,50);saveDB();toast("Prompt saved")}
function surprise(){
const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)][0];
S.sel={...S.sel,project:pick(DATA.project),finish:pick(DATA.finish),purpose:pick(DATA.purpose),visual:pick(DATA.visual),camera:pick(DATA.camera),colour:pick([["Natural Grey"],["Charcoal"],["Slate Grey"],["Tan"],["Brown"],["Sandstone"]]),scene:pick([["New Build"],["Existing Home"],["Backyard"],["Front Entrance"],["Lakeside"],["Muskoka"],["Urban"],["Rural"]])};
saveDB();render();setTimeout(generate,50);
}
function renderPresets(a){
a.innerHTML=`<section class="hero"><div class="eyebrow">PRESET LIBRARY</div><h1>Everything<br>ready to tap.</h1><p>The long-term goal: almost no typing. Add as many presets as we need.</p></section>
${Object.entries(DATA).map(([k,v])=>`<div class="section">${k.toUpperCase()}</div><div class="grid">${v.map(x=>`<button class="preset" onclick="usePreset('${k}','${esc(x[0])}')">${k==="project"?`<div class="catpic">${catSvg(x[1])}</div>`:""}<b>${esc(x[0])}</b><span>${esc(x[2]||x[1])}</span></button>`).join("")}</div>`).join("")}
<div class="card" style="margin-top:14px"><b>Next preset packs</b><p style="color:var(--muted);font-size:13px">Ad copy • Negative prompts • Seasons • weather • locations • concrete colours • landscaping • house styles • camera lenses • lighting • social dimensions • video movement • municipal scenes • logo placements.</p></div>`;
}
function usePreset(k,v){if(k==="project"||k==="finish"||k==="purpose"||k==="visual"||k==="camera"){S.sel[k]=v;saveDB();setPage("create")}}
function renderSaved(a){
const list=S.saved||[];
a.innerHTML=`<section class="hero"><div class="eyebrow">YOUR LIBRARY</div><h1>Saved Prompts</h1><p>Keep the prompts you use repeatedly and build your own library over time.</p></section>${list.length?list.map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.date)}</p><div class="btns"><button class="smallbtn" onclick="copySaved(${i})">COPY</button><button class="smallbtn" onclick="loadSaved(${i})">OPEN</button><button class="smallbtn" onclick="deleteSaved(${i})">DELETE</button></div></div>`).join(""):`<div class="card empty">No saved prompts yet.<br>Generate one and tap SAVE.</div>`}`;
}
function copySaved(i){navigator.clipboard.writeText(S.saved[i].prompt).then(()=>toast("Copied"))}
function loadSaved(i){S.lastPrompt=S.saved[i].prompt;setPage("create");setTimeout(()=>{document.getElementById("result").innerHTML=`<div class="result"><div class="in"><h3>SAVED PROMPT</h3><pre id="promptText">${esc(S.lastPrompt)}</pre><div class="btns"><button class="smallbtn" onclick="copyPrompt()">COPY</button></div></div></div>`},30)}
function deleteSaved(i){S.saved.splice(i,1);saveDB();renderSaved(document.getElementById("app"))}
function renderBrand(a){
a.innerHTML=`<section class="hero"><div class="eyebrow">LOCKED BRAND LAYER</div><h1>Kowalski DNA</h1><p>These rules are automatically added to generated prompts so you don't have to type them every time.</p></section>
<div class="card">${brandDNA.map(x=>`<div style="padding:8px 0;border-bottom:1px solid var(--line);font-size:14px">✓ ${esc(x)}</div>`).join("")}</div>
<div class="card"><label>YOUR EXTRA BRAND RULES</label><textarea id="brandNotes" placeholder="Anything else you want every prompt to know...">${esc(S.brandNotes||"")}</textarea><button class="btn primary" style="width:100%;margin-top:10px" onclick="S.brandNotes=document.getElementById('brandNotes').value;saveDB();toast('Brand rules saved')">SAVE BRAND RULES</button></div>`;
}
function toast(t){let e=document.getElementById("toast");if(!e){e=document.createElement("div");e.id="toast";e.style="position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#F5F3F0;color:#141414;padding:10px 16px;border-radius:10px;font-weight:700;z-index:30";document.body.appendChild(e)}e.textContent=t;e.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>e.style.display="none",1800)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>setPage(b.dataset.page));
render();
</script>
